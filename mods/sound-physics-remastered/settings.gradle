pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.maxhenkel.de/repository/public' }
        maven { url = 'https://maven.minecraftforge.net' }
    }
}

rootProject.name = 'sound-physics-remastered'
// Only "neoforge" is included here (unlike upstream's common/fabric/neoforge/forge) -- same
// reasoning as mods/Automobility/settings.gradle.kts: "common" was a fabric-loom project (needed
// intermediary mappings for a deobfuscated Minecraft + Mixin AP dev environment), and
// fabric-loom needs a newer Gradle (plugin api-version 9.2.0) than this repo runs (8.11), so it
// fails to even resolve at configuration time. "common"'s sources (com.sonicether.soundphysics.*,
// no Fabric-specific references at all) are merged directly into neoforge/src/main instead,
// making this a pure NeoForge module with no Fabric dependency -- see neoforge/build.gradle's
// comment. "fabric" and "forge" are dropped for the same "we only ever build/distribute the
// neoforge variant" reason ModernUI-MC/VoxelMap already established for this repo.
include('neoforge')