pluginManagement {
    repositories {
        maven {
            url 'https://maven.minecraftforge.net/'
        }
        maven {
            url 'https://maven.neoforged.net/releases/'
        }
        maven {
            url 'https://maven.fabricmc.net/'
        }
        maven {
            url 'https://maven.architectury.dev/'
        }
        maven {
            url 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            url 'https://repo.sleeping.town/'
            content {
                includeGroup 'agency.highlysuspect'
                includeGroup 'agency.highlysuspect.minivan'
            }
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'ModernUI-MC'

// This fork only builds "common" and "neoforge" -- DNCity (the downstream consumer, via a
// composite build) is a NeoForge-only mod, so upstream's "forge" (old ForgeGradle) and "fabric"
// (Fabric Loom) subprojects are dropped to avoid pulling in their toolchains/plugins for no
// reason.
include 'common'

include 'neoforge'
project(':neoforge').name = "ModernUI-NeoForge"
